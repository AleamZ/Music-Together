# CI/CD to the self-hosted VPS (deploy/README.md), alongside Vercel: every push to the deploy branch is checked
# (typecheck, unit tests), then deployed over SSH (scripts/vps/deploy.sh builds and restarts it on the server).
# Secrets: VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY. Variable (optional): DEPLOY_BRANCH (default dev).
name: Deploy VPS
on:
  push:
    branches: [dev]
  workflow_dispatch:
concurrency:
  group: deploy-vps
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p .
      # (lint is not a gate yet: the repo has 22 older lint errors outside the game code)
      - run: pnpm test
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: /opt/music-together/scripts/vps/deploy.sh ${{ vars.DEPLOY_BRANCH || 'dev' }}
