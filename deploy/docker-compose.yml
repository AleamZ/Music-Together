# The VPS stack (deploy/README.md). `app` is the Next.js server on 127.0.0.1:3000 (never exposed directly); the domain
# reaches it through ONE of (deploy.sh picks "quick" by itself while no tunnel token is set):
#   - profile "quick":  a temporary https://….trycloudflare.com link, before the domain is ready
#   - profile "tunnel": Cloudflare Tunnel (cloudflared) — works behind a NAT VPS with no open 80/443, HTTPS by Cloudflare
#   - profile "caddy":  Caddy on 80/443 with automatic Let's Encrypt (needs those two ports forwarded to the VPS)
# One stack per branch (dev, main): scripts/vps/deploy.sh runs it as project "music-together-<branch>" from that
# branch's own checkout and .env, so the two never share containers, networks, ports or tunnels.
services:
  app:
    build:
      context: ..
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-prod}
    env_file: ../.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]
    restart: unless-stopped

  # no domain yet: a Cloudflare quick tunnel — a free random https://<words>.trycloudflare.com link, no account needed
  # (it changes on every restart; deploy.sh prints it)
  quicktunnel:
    profiles: ["quick"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on: [app]
    restart: unless-stopped

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
